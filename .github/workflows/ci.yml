name: build-and-test-linux
on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"
jobs:
  build-and-test:
    # Ref: https://github.com/actions/runner-images/tree/main/images/macos
    strategy:
      matrix:
        os: [ macos-14, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # setup-go sets GOTOOLCHAIN=local, so this must satisfy go.mod
          # (go 1.25). 1.26.6 matches the toolchain directive.
          go-version: "1.26.6"

      - name: go test
        run: go test ./...
